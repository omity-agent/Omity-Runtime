fonts:
  body:
    value: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
  mono:
    value: ui-monospace, SFMono-Regular, Consolas, monospace
styles:
  accessHeading:
    value:
      fontSize: xl
      fontWeight: medium
  badge:
    value:
      fontFamily: body
      fontSize: metadata
      fontWeight: normal
  codeBlock:
    value:
      fontFamily: mono
      fontSize: source
      lineHeight: code
  codeElement:
    value:
      fontFamily: inherit
      fontSize: inherit
      lineHeight: inherit
  contextUsage:
    value:
      fontFamily: mono
      fontSize: metadata
  control:
    value:
      fontFamily: body
      fontSize: interface
      fontWeight: normal
  formPrompt:
    value:
      fontSize: sm
      fontWeight: medium
      lineHeight: normal
  inlineCode:
    value:
      fontFamily: mono
      fontSize: source
      lineHeight: tight
  markdownHeading:
    value:
      fontSize: calc(1em + var(--heading-size, {fontSizes.md}) - {fontSizes.md})
      fontWeight: bold
      lineHeight: markdownHeading
  pathUnderline:
    value:
      textDecorationColor: current
      textDecorationLine: underline
      textUnderlineOffset: 0.15em
  selectedCaption:
    value:
      fontWeight: semibold
  sidebarCount:
    value:
      fontSize: metadata
      fontWeight: normal
      letterSpacing: "0"
  sourceCode:
    value:
      fontFamily: mono
      fontSize: inherit
      lineHeight: inherit
