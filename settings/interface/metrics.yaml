dimensions:
  animations:
    detailCollapse:
      value: detailCollapse 140ms ease-in
    detailExpand:
      value: detailExpand 140ms ease-out
    progressPulse:
      value: pulse 1.8s ease-in-out infinite
  borderWidths:
    "0":
      value: "0"
    accent:
      value: 4px
    hairline:
      value: 1px
    medium:
      value: 3px
  durations:
    fast:
      value: 120ms
    medium:
      value: 150ms
  lineHeights:
    code:
      value: "1.65"
    editor:
      value: "1.6"
    markdown:
      value: "1.7"
    markdownHeading:
      value: "1.35"
  sizes:
    accessCard:
      value: 32rem
    appSidebar:
      value: clamp(15rem, 22vw, 20rem)
    composerLimit:
      value: 50dvh
    content:
      value: 52rem
    detailHeader:
      value: 2.25rem
    sourceLine:
      value: 1lh
    toolOutput:
      value: 16rem
    toolOutputMinimum:
      value: 3rem
    viewport:
      value: 100dvh
  spacing:
    focusInset:
      value: -1px
    safeAreaBlockEnd:
      value: env(safe-area-inset-bottom)
    safeAreaBlockStart:
      value: env(safe-area-inset-top)
    safeAreaInlineEnd:
      value: env(safe-area-inset-right)
    safeAreaInlineStart:
      value: env(safe-area-inset-left)
    sidebarInset:
      value: 2px
  zIndex:
    base:
      value: 1
    pinned:
      value: 2
adaptive:
  animations:
    disabled:
      value: none
  fontSizes:
    editor:
      value:
        _coarse: "{fontSizes.md}"
        _compact: "{fontSizes.md}"
        base: "{fontSizes.sm}"
    interface:
      value:
        _compact: 0.9375rem
        base: 0.8125rem
    metadata:
      value:
        _compact: 0.8125rem
        base: "{fontSizes.xs}"
    source:
      value:
        _compact: 0.9375rem
        base: "{fontSizes.sm}"
  sizes:
    controlTarget:
      value:
        _coarse: "{sizes.11}"
        _compact: "{sizes.11}"
        base: "{sizes.8}"
    interfaceIcon:
      value:
        _coarse: "{sizes.4.5}"
        _compact: "{sizes.4.5}"
        base: "{sizes.4}"
    smallIcon:
      value:
        _compact: "{sizes.4}"
        base: "{sizes.3.5}"
